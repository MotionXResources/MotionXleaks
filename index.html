<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotionXleaks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@300;400;600;700&family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #090909;
            --surface: #0d0d0d;
            --elevated: #131313;
            --border: rgba(255,255,255,0.06);
            --border-light: rgba(255,255,255,0.11);
            --text: #d8d4e0;
            --text-dim: #4a4852;
            --text-mid: #7a7585;
            --accent: #b8b0cc;
            --purple: #7c4dff;
        }

        body {
            font-family: 'Syne', sans-serif;
            background: linear-gradient(160deg, #0d0d0d 0%, #111111 25%, #0f0d16 55%, #111111 80%, #0d0d0d 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0;
            animation: glide linear infinite;
        }

        @keyframes glide {
            0%   { opacity: 0; transform: translateY(0) translateX(0); }
            10%  { opacity: 1; }
            90%  { opacity: 1; }
            100% { opacity: 0; transform: translateY(-100vh) translateX(var(--drift)); }
        }

        /* Header */
        header {
            padding: 1.6rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: rgba(8,8,8,0.82);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            z-index: 100;
            animation: headerIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
        }

        @keyframes headerIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-weight: 400;
            font-size: 1.55rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text);
            line-height: 1;
        }

        .logo-main {
            color: #e0dcea;
            letter-spacing: 0.2em;
        }
        .logo-sub {
            color: var(--text-dim);
            letter-spacing: 0.3em;
            font-size: 1.35rem;
            margin-left: 0.05em;
        }

        .admin-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-dim);
            padding: 0.55rem 1.4rem;
            cursor: pointer;
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.25s, border-color 0.25s, background 0.25s, box-shadow 0.25s;
            border-radius: 2px;
        }

        .admin-btn:hover {
            color: var(--accent);
            border-color: rgba(124,77,255,0.4);
            background: rgba(124,77,255,0.06);
        }

        .admin-btn.active {
            background: rgba(100,65,200,0.6);
            color: #fff;
            border-color: var(--purple);
            box-shadow: 0 0 18px rgba(124,77,255,0.18);
        }

        /* Container */
        .container {
            max-width: 1380px;
            margin: 0 auto;
            padding: 4rem 3rem;
            position: relative;
            z-index: 10;
        }

        /* Search */
        .search-container {
            margin-bottom: 3.5rem;
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .search-wrap {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
        }

        .search-bar {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem 1.4rem 1rem 3rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
            border-radius: 3px;
        }

        .search-bar::placeholder { color: var(--text-dim); }

        .search-bar:hover { border-color: rgba(124,77,255,0.2); background: rgba(16,15,18,0.85); }

        .search-bar:focus {
            outline: none;
            border-color: rgba(124,77,255,0.35);
            background: rgba(16,15,18,0.92);
            box-shadow: 0 0 0 1px rgba(124,77,255,0.08), 0 8px 32px rgba(0,0,0,0.4);
        }

        .search-wrap::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%;
            width: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(124,77,255,0.7), transparent);
            transition: width 0.45s cubic-bezier(0.22,1,0.36,1), left 0.45s cubic-bezier(0.22,1,0.36,1);
        }

        .search-wrap:focus-within::after { width: 100%; left: 0; }

        .search-icon {
            position: absolute;
            left: 1rem; top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 0.9rem;
            pointer-events: none;
            transition: color 0.3s;
        }

        .search-wrap:focus-within .search-icon { color: rgba(124,77,255,0.6); }

        /* Upload */
        .upload-section {
            margin-bottom: 4rem;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transform: translateY(-10px);
            pointer-events: none;
            transition: max-height 0.5s cubic-bezier(0.22,1,0.36,1),
                        opacity 0.4s cubic-bezier(0.22,1,0.36,1),
                        transform 0.4s cubic-bezier(0.22,1,0.36,1);
            will-change: opacity, transform;
        }
        .upload-section.active {
            max-height: 800px;
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }

        .upload-header {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 1.2rem;
        }

        .upload-form {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
            border-radius: 6px;
        }

        .form-group { display: flex; flex-direction: column; }
        .form-group.full-width { grid-column: 1 / -1; }

        .form-group label {
            font-family: 'DM Mono', monospace;
            font-size: 0.62rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 0.5rem;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .form-group:focus-within label { color: var(--text-mid); }

        .form-group input[type="text"] {
            background: var(--elevated);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.8rem 1rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            border-radius: 4px;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: rgba(124,77,255,0.3);
            background: rgba(20,16,30,0.9);
            box-shadow: 0 0 0 3px rgba(124,77,255,0.06);
        }

        .file-drop-zone {
            position: relative;
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 4px;
            background: var(--elevated);
            padding: 1rem;
            cursor: pointer;
            transition: border-color 0.25s, background 0.25s, box-shadow 0.25s;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            min-height: 58px;
            overflow: hidden;
        }

        .file-drop-zone:hover, .file-drop-zone.dragover {
            border-color: rgba(124,77,255,0.4);
            background: rgba(20,16,32,0.95);
            box-shadow: 0 0 0 3px rgba(124,77,255,0.06);
        }

        .file-drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .drop-icon {
            font-size: 1.1rem;
            opacity: 0.35;
            flex-shrink: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            color: var(--text-mid);
        }

        .file-drop-zone:hover .drop-icon { opacity: 0.7; transform: translateY(-2px); }

        .drop-text {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            pointer-events: none;
            min-width: 0;
        }

        .drop-title {
            font-family: 'DM Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-mid);
            transition: color 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-drop-zone:hover .drop-title { color: var(--text); }

        .drop-hint {
            font-family: 'DM Mono', monospace;
            font-size: 0.6rem;
            color: var(--text-dim);
            letter-spacing: 0.06em;
        }

        .file-drop-zone.has-file { border-color: rgba(124,77,255,0.3); background: rgba(18,14,28,0.95); }
        .file-drop-zone.has-file .drop-icon { opacity: 0.9; }
        .file-drop-zone.has-file .drop-title { color: var(--accent); }

        .upload-submit {
            grid-column: 1 / -1;
            background: rgba(100,65,200,0.65);
            color: #fff;
            border: 1px solid rgba(124,77,255,0.3);
            padding: 1rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s, box-shadow 0.25s, transform 0.15s, border-color 0.25s;
            border-radius: 4px;
            margin-top: 0.4rem;
        }

        .upload-submit:hover {
            background: rgba(124,77,255,0.85);
            border-color: rgba(160,110,255,0.5);
            box-shadow: 0 6px 20px rgba(124,77,255,0.25);
            transform: translateY(-1px);
        }

        .upload-submit:active { transform: translateY(0); }
        .upload-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* Grid header */
        .grid-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: fadeUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.45s forwards;
        }

        .grid-label {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .file-count {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            color: var(--text-dim);
        }

        /* File grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
            opacity: 0;
            animation: fadeUp 0.7s cubic-bezier(0.22,1,0.36,1) 0.5s forwards;
        }

        .file-card {
            background: var(--surface);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(16px) translateZ(0);
            will-change: transform, opacity;
            backface-visibility: hidden;
            transition: background 0.3s, transform 0.4s cubic-bezier(0.22,1,0.36,1), box-shadow 0.4s;
        }

        .file-card.visible {
            animation: cardIn 0.55s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        .file-card.removing {
            pointer-events: none;
            opacity: 0 !important;
            transform: translateY(-10px) scale(0.97) translateZ(0) !important;
            transition: opacity 0.3s cubic-bezier(0.4,0,0.2,1),
                        transform 0.3s cubic-bezier(0.4,0,0.2,1) !important;
        }

        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0) translateZ(0); }
        }

        .file-card:hover {
            background: var(--elevated);
            transform: translateY(-4px) translateZ(0);
            box-shadow: 0 24px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(124,77,255,0.1);
            z-index: 5;
        }

        .media-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16/10;
            overflow: hidden;
            background: #080808;
        }

        .media-container img,
        .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(50%) brightness(0.85);
            transition: filter 0.5s ease, transform 0.6s cubic-bezier(0.22,1,0.36,1);
            will-change: transform, filter;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .file-card:hover .media-container img,
        .file-card:hover .media-container video {
            filter: grayscale(0%) brightness(1);
            transform: scale(1.05) translateZ(0);
        }

        .media-container::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(9,9,9,0.7) 0%, transparent 50%);
            pointer-events: none;
        }

        .media-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #222;
            font-size: 2rem;
        }

        /* Mute button */
        .mute-btn {
            position: absolute;
            bottom: 0.7rem;
            right: 0.7rem;
            width: 30px; height: 30px;
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(255,255,255,0.12);
            color: var(--text);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border-radius: 50%;
            z-index: 15;
            backdrop-filter: blur(8px);
            transition: background 0.2s, transform 0.2s, border-color 0.2s;
        }

        .has-video .mute-btn { display: flex; }

        .mute-btn:hover {
            background: rgba(124,77,255,0.5);
            border-color: rgba(124,77,255,0.5);
            transform: scale(1.1);
        }

        .file-info { padding: 1.3rem 1.4rem 1.4rem; }

        .file-name {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--accent);
            transition: color 0.2s;
        }

        .file-card:hover .file-name { color: #fff; }

        .file-meta {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
            transition: color 0.2s;
        }

        .file-card:hover .file-meta { color: var(--text-mid); }

        .download-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-dim);
            padding: 0.55rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 2px;
            transition: color 0.25s, border-color 0.25s, background 0.25s, box-shadow 0.25s;
        }

        .download-btn:hover {
            color: #fff;
            border-color: var(--purple);
            background: rgba(124,77,255,0.1);
            box-shadow: 0 0 12px rgba(124,77,255,0.08);
        }

        .delete-btn {
            position: absolute;
            top: 0.8rem; right: 0.8rem;
            width: 28px; height: 28px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-mid);
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s, transform 0.2s;
            z-index: 20;
            border-radius: 2px;
        }

        .file-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: rgba(200,50,50,0.5); transform: scale(1.1); }
        .admin-mode .delete-btn { display: flex; }

        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            padding: 6rem;
            text-align: center;
            color: var(--text-dim);
            background: var(--surface);
        }

        .empty-state p {
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }

        /* Cortana */
        .cortana-container {
            position: fixed;
            bottom: 2rem; right: 2rem;
            z-index: 50;
            cursor: pointer;
        }

        .cortana {
            width: 72px; height: 72px;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid rgba(180,170,200,0.2);
            transition: transform 0.4s cubic-bezier(0.22,1,0.36,1), border-color 0.3s, box-shadow 0.3s;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 14px rgba(124,77,255,0.06);
        }

        .cortana img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(40%) brightness(0.85);
            transition: filter 0.4s;
        }

        .cortana-container:hover .cortana {
            border-color: rgba(124,77,255,0.4);
            transform: translateY(-6px) scale(1.06);
            box-shadow: 0 20px 48px rgba(0,0,0,0.6), 0 0 20px rgba(124,77,255,0.12);
        }

        .cortana-container:hover .cortana img { filter: grayscale(10%) brightness(1); }
        .cortana-container:active .cortana { transform: translateY(-2px) scale(0.97); }

        .cortana-ping {
            position: absolute;
            inset: -1px;
            border: 1px solid rgba(160,140,200,0.2);
            border-radius: 50%;
            animation: pingRing 2.5s ease-out infinite;
        }

        @keyframes pingRing {
            0%  { opacity: 0.5; transform: scale(1); }
            100%{ opacity: 0;   transform: scale(1.6); }
        }

        .cortana-bubble {
            position: absolute;
            bottom: 86px; right: 0;
            background: var(--elevated);
            border: 1px solid var(--border-light);
            padding: 0.8rem 1.2rem;
            min-width: 180px;
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-mid);
            letter-spacing: 0.04em;
            border-radius: 6px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.5);
            opacity: 0;
            transform: translateY(6px) scale(0.96);
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.22,1,0.36,1), transform 0.3s cubic-bezier(0.22,1,0.36,1);
        }

        .cortana-bubble.show { opacity: 1; transform: translateY(0) scale(1); }

        .cortana-bubble::after {
            content: '';
            position: absolute;
            bottom: -6px; right: 26px;
            width: 10px; height: 10px;
            background: var(--elevated);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            transform: rotate(45deg);
        }

        /* Modals */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s cubic-bezier(0.4,0,0.2,1),
                        visibility 0.35s cubic-bezier(0.4,0,0.2,1);
            will-change: opacity;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
            pointer-events: all;
        }

        .modal-content {
            background: var(--elevated);
            border: 1px solid var(--border-light);
            padding: 3rem;
            width: 90%; max-width: 380px;
            position: relative;
            border-radius: 6px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8);
            opacity: 0;
            transform: translateY(18px) scale(0.97);
            transition: opacity 0.38s cubic-bezier(0.22,1,0.36,1),
                        transform 0.38s cubic-bezier(0.22,1,0.36,1);
            will-change: transform, opacity;
        }

        .modal.active .modal-content {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .modal-title {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            color: var(--text-mid);
        }

        .modal-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 1rem;
            font-family: 'DM Mono', monospace;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 0.2em;
            margin-bottom: 1rem;
            border-radius: 3px;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .modal-input:focus {
            outline: none;
            border-color: rgba(124,77,255,0.3);
            box-shadow: 0 0 0 3px rgba(124,77,255,0.06);
        }

        .modal-btn {
            width: 100%;
            background: rgba(100,65,200,0.6);
            color: #fff;
            border: none;
            padding: 1rem;
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 3px;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .modal-btn:hover {
            background: rgba(124,77,255,0.85);
            box-shadow: 0 8px 24px rgba(124,77,255,0.3);
            transform: translateY(-1px);
        }

        .modal-btn:active { transform: translateY(0); }

        .modal-close {
            position: absolute;
            top: 1.2rem; right: 1.2rem;
            width: 34px; height: 34px;
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: color 0.2s, background 0.2s, transform 0.3s;
        }

        .modal-close:hover { color: var(--text); background: rgba(255,255,255,0.06); transform: rotate(90deg); }

        .error-msg {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: #e05555;
            margin-top: 1rem;
            text-align: center;
            opacity: 0;
            transform: translateY(-4px);
            transition: opacity 0.2s, transform 0.2s;
        }

        .error-msg.show { opacity: 1; transform: translateY(0); }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }

        .shake { animation: shake 0.4s ease; }

        @media (max-width: 768px) {
            header { padding: 1.2rem 1.5rem; }
            .container { padding: 3rem 1.5rem; }
            .upload-form { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: 1; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>

    <header>
        <div class="logo"><span class="logo-main">MOTIONX</span><span class="logo-sub">LEAKS</span></div>
        <button class="admin-btn" id="adminBtn" onclick="toggleAdmin()">Admin</button>
    </header>

    <div class="container">
        <div class="search-container">
            <div class="search-wrap">
                <span class="search-icon">⌕</span>
                <input type="text" class="search-bar" id="searchBar" placeholder="Search files..." oninput="filterFiles(this.value)">
            </div>
        </div>

        <div class="upload-section" id="uploadSection">
            <div class="upload-header">Upload Protocol</div>
            <form class="upload-form" id="uploadForm">
                <div class="form-group full-width">
                    <label>Filename</label>
                    <input type="text" id="fileName" placeholder="Enter a display name...">
                </div>
                <div class="form-group full-width">
                    <label>Main File <span style="color:rgba(124,77,255,0.6);margin-left:auto;font-size:0.58rem">required</span></label>
                    <div class="file-drop-zone" id="mainFileDrop">
                        <input type="file" id="mainFile" onchange="onFileChange(this,'mainFileDrop','mainFileTitle','mainFileHint')">
                        <span class="drop-icon">↑</span>
                        <div class="drop-text">
                            <span class="drop-title" id="mainFileTitle">Drop file or click to browse</span>
                            <span class="drop-hint" id="mainFileHint">Any file type accepted</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Thumbnail</label>
                    <div class="file-drop-zone" id="thumbFileDrop">
                        <input type="file" id="thumbFile" accept="image/*" onchange="onFileChange(this,'thumbFileDrop','thumbFileTitle','thumbFileHint')">
                        <span class="drop-icon">◫</span>
                        <div class="drop-text">
                            <span class="drop-title" id="thumbFileTitle">Drop image or browse</span>
                            <span class="drop-hint" id="thumbFileHint">JPG, PNG, GIF, WEBP</span>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Cover Video</label>
                    <div class="file-drop-zone" id="coverVideoDrop">
                        <input type="file" id="coverVideo" accept="video/*" onchange="onFileChange(this,'coverVideoDrop','coverVideoTitle','coverVideoHint')">
                        <span class="drop-icon">▶</span>
                        <div class="drop-text">
                            <span class="drop-title" id="coverVideoTitle">Drop video or browse</span>
                            <span class="drop-hint" id="coverVideoHint">MP4, WEBM, MOV</span>
                        </div>
                    </div>
                </div>
                <button type="button" class="upload-submit" id="uploadSubmitBtn" onclick="handleUpload(event)">Initialize Upload</button>
            </form>
        </div>

        <div class="grid-header">
            <span class="grid-label">Repository</span>
            <span class="file-count" id="fileCount">0 files</span>
        </div>

        <div class="file-grid" id="fileGrid">
            <div class="empty-state"><p>No files in repository</p></div>
        </div>
    </div>

        <div class="cortana-bubble" id="cortanaBubble">System standby...</div>
    </div>

    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('adminModal')">×</button>
            <div class="modal-title">Admin Access</div>
            <input type="password" class="modal-input" id="adminPass" placeholder="••••••••">
            <button class="modal-btn" onclick="verifyAdmin()">Enter</button>
            <div class="error-msg" id="adminError">Access denied</div>
        </div>
    </div>

    <div class="modal" id="downloadModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('downloadModal')">×</button>
            <div class="modal-title">Secure Download</div>
            <input type="password" class="modal-input" id="downloadPass" placeholder="••••••••">
            <button class="modal-btn" onclick="verifyDownload()">Download</button>
            <div class="error-msg" id="downloadError">Invalid key</div>
        </div>
    </div>

    <script>
        let isAdmin = false;
        let files = [];
        let currentDownload = null;
        let clickCount = 0;

        const ADMIN_PASS = "mtxadmin@";
        const DOWNLOAD_PASS = "MotionXpass@@";

        const cortanaIdleMsgs = ["System standby...","Monitoring...","Ready for input","Awaiting commands","Security active","Scanning...","Idle mode"];
        const cortanaClickMsgs = ["Hey!","Stop clicking me!","That tickles!","I'm watching you...","Click me again, I dare you","System overload!","Error: Too many clicks","Hey, I'm trying to work here!","Do you need something?","I'm not a toy!","Click detected...","Stop it!","You're persistent, aren't you?","Beep boop... just kidding","I'm alive, you know"];

        // Particles
        (function() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 35; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 2.5 + 1;
                const isPurple = Math.random() > 0.7;
                const duration = Math.random() * 20 + 15;
                const delay = Math.random() * 25;
                const drift = (Math.random() - 0.5) * 120;
                p.style.cssText = [
                    'width:' + size + 'px',
                    'height:' + size + 'px',
                    'left:' + (Math.random() * 100) + '%',
                    'bottom:' + (Math.random() * -20) + '%',
                    'background:' + (isPurple ? 'rgba(140,90,255,0.45)' : 'rgba(180,180,180,0.25)'),
                    'animation-duration:' + duration + 's',
                    'animation-delay:-' + delay + 's',
                    '--drift:' + drift + 'px'
                ].join(';');
                container.appendChild(p);
            }
        })();

        // Cortana
        const cortanaContainer = document.getElementById('cortanaContainer');
        cortanaContainer.addEventListener('mouseenter', () => cortanaSpeak("Need help?"));
        cortanaContainer.addEventListener('click', e => {
            e.stopPropagation();
            clickCount++;
            cortanaSpeak(cortanaClickMsgs[Math.min(clickCount-1, cortanaClickMsgs.length-1)]);
        });

        function cortanaSpeak(msg) {
            const bubble = document.getElementById('cortanaBubble');
            bubble.textContent = msg;
            bubble.classList.add('show');
            setTimeout(() => bubble.classList.remove('show'), Math.max(2200, msg.length * 60));
        }

        setInterval(() => {
            const bubble = document.getElementById('cortanaBubble');
            if (Math.random() > 0.6 && !bubble.classList.contains('show'))
                cortanaSpeak(cortanaIdleMsgs[Math.floor(Math.random() * cortanaIdleMsgs.length)]);
        }, 9000);

        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('uploadSection').classList.remove('active');
                document.getElementById('adminBtn').classList.remove('active');
                document.getElementById('adminBtn').textContent = 'Admin';
                document.body.classList.remove('admin-mode');
                renderFiles();
                cortanaSpeak("Admin logged out");
            } else {
                openModal('adminModal');
                setTimeout(() => document.getElementById('adminPass').focus(), 120);
            }
        }

        function openModal(id) {
            const m = document.getElementById(id);
            m.classList.add('active');
        }

        function closeModal(id) {
            const m = document.getElementById(id);
            m.classList.remove('active');
            setTimeout(() => {
                m.querySelectorAll('input').forEach(i => i.value = '');
                m.querySelectorAll('.error-msg').forEach(e => e.classList.remove('show'));
            }, 380);
        }

        function verifyAdmin() {
            if (document.getElementById('adminPass').value === ADMIN_PASS) {
                isAdmin = true;
                closeModal('adminModal');
                document.getElementById('uploadSection').classList.add('active');
                document.getElementById('adminBtn').classList.add('active');
                document.getElementById('adminBtn').textContent = 'Exit';
                document.body.classList.add('admin-mode');
                renderFiles();
                cortanaSpeak("Welcome back, admin");
            } else {
                const c = document.querySelector('#adminModal .modal-content');
                c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
                document.getElementById('adminError').classList.add('show');
                cortanaSpeak("Access denied!");
            }
        }

        function onFileChange(input, zoneId, titleId, hintId) {
            const zone = document.getElementById(zoneId);
            const title = document.getElementById(titleId);
            const hint = document.getElementById(hintId);
            if (input.files && input.files[0]) {
                zone.classList.add('has-file');
                title.textContent = input.files[0].name;
                hint.textContent = formatSize(input.files[0].size);
            } else {
                zone.classList.remove('has-file');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.file-drop-zone').forEach(zone => {
                zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
                zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
                zone.addEventListener('drop', e => {
                    e.preventDefault();
                    zone.classList.remove('dragover');
                    const input = zone.querySelector('input[type="file"]');
                    if (e.dataTransfer.files.length && input) {
                        input.files = e.dataTransfer.files;
                        input.dispatchEvent(new Event('change'));
                    }
                });
            });
        });

        function handleUpload(e) {
            if (e && e.preventDefault) e.preventDefault();
            const nameVal = document.getElementById('fileName').value.trim();
            const mainFileInput = document.getElementById('mainFile');
            if (!nameVal) { cortanaSpeak("Enter a filename!"); return; }
            if (!mainFileInput.files || !mainFileInput.files[0]) { cortanaSpeak("Select a file first!"); return; }

            const mainFile = mainFileInput.files[0];
            const thumb = document.getElementById('thumbFile').files[0] || null;
            const video = document.getElementById('coverVideo').files[0] || null;

            const btn = document.getElementById('uploadSubmitBtn');
            btn.textContent = 'Processing...';
            btn.disabled = true;

            const fileData = {
                id: Date.now(),
                name: nameVal,
                mainFile: mainFile.name,
                size: formatSize(mainFile.size),
                thumb: null,
                video: video ? URL.createObjectURL(video) : null,
                blobUrl: URL.createObjectURL(mainFile)
            };

            const readers = [];
            if (thumb) {
                readers.push(new Promise(res => {
                    const r = new FileReader();
                    r.onload = ev => { fileData.thumb = ev.target.result; res(); };
                    r.readAsDataURL(thumb);
                }));
            }

            Promise.all(readers).then(() => {
                files.push(fileData);
                renderFiles();
                document.getElementById('uploadForm').reset();
                document.querySelectorAll('.file-drop-zone').forEach(z => z.classList.remove('has-file'));
                document.getElementById('mainFileTitle').textContent = 'Drop file or click to browse';
                document.getElementById('mainFileHint').textContent = 'Any file type accepted';
                document.getElementById('thumbFileTitle').textContent = 'Drop image or browse';
                document.getElementById('thumbFileHint').textContent = 'JPG, PNG, GIF, WEBP';
                document.getElementById('coverVideoTitle').textContent = 'Drop video or browse';
                document.getElementById('coverVideoHint').textContent = 'MP4, WEBM, MOV';
                btn.textContent = 'Initialize Upload';
                btn.disabled = false;
                cortanaSpeak("Upload complete!");
            }).catch(() => {
                cortanaSpeak("Upload failed!");
                btn.textContent = 'Initialize Upload';
                btn.disabled = false;
            });
        }

        function formatSize(b) {
            if (b === 0) return '0 B';
            const k = 1024, s = ['B','KB','MB','GB'];
            const i = Math.floor(Math.log(b) / Math.log(k));
            return parseFloat((b / Math.pow(k,i)).toFixed(1)) + ' ' + s[i];
        }

        function filterFiles(query) {
            document.querySelectorAll('.file-card').forEach(card => {
                const name = card.querySelector('.file-name').textContent.toLowerCase();
                card.style.display = name.includes(query.toLowerCase()) ? '' : 'none';
            });
        }

        function renderFiles() {
            const grid = document.getElementById('fileGrid');
            document.getElementById('fileCount').textContent = files.length + ' file' + (files.length !== 1 ? 's' : '');
            if (files.length === 0) {
                grid.innerHTML = '<div class="empty-state"><p>No files in repository</p></div>';
                return;
            }
            grid.innerHTML = files.map((f, i) => `
                <div class="file-card" style="animation-delay:${i*0.07}s">
                    ${isAdmin ? `<button class="delete-btn" onclick="deleteFile(${f.id})">×</button>` : ''}
                    <div class="media-container ${f.video ? 'has-video' : ''}">
                        ${f.video
                            ? `<video id="vid_${f.id}" src="${f.video}" muted loop autoplay playsinline preload="auto"></video>
                               <button class="mute-btn" id="mute_${f.id}" onclick="toggleMute(${f.id},event)" title="Unmute">▶</button>`
                            : f.thumb
                            ? `<img src="${f.thumb}" alt="">`
                            : '<div class="media-placeholder">◉</div>'}
                    </div>
                    <div class="file-info">
                        <div class="file-name">${f.name}</div>
                        <div class="file-meta">${f.size} · ${f.mainFile}</div>
                        <button class="download-btn" onclick="initDownload(${f.id})">Download</button>
                    </div>
                </div>
            `).join('');

            requestAnimationFrame(() => {
                grid.querySelectorAll('.file-card').forEach((card, i) => {
                    setTimeout(() => card.classList.add('visible'), i * 70);
                });
            });
        }

        function toggleMute(id, e) {
            e.stopPropagation();
            const vid = document.getElementById('vid_' + id);
            const btn = document.getElementById('mute_' + id);
            if (!vid) return;
            vid.muted = !vid.muted;
            btn.textContent = vid.muted ? '▶' : '◼';
            btn.title = vid.muted ? 'Unmute' : 'Mute';
        }

        function deleteFile(id) {
            if (confirm('Delete this file?')) {
                // Animate card out first
                const card = document.querySelector(`[onclick="deleteFile(${id})"]`)?.closest('.file-card');
                if (card) {
                    card.classList.add('removing');
                    setTimeout(() => {
                        files = files.filter(f => f.id !== id);
                        renderFiles();
                        cortanaSpeak("File deleted");
                    }, 370);
                } else {
                    files = files.filter(f => f.id !== id);
                    renderFiles();
                    cortanaSpeak("File deleted");
                }
            }
        }

        function initDownload(id) {
            currentDownload = files.find(f => f.id === id);
            openModal('downloadModal');
            setTimeout(() => document.getElementById('downloadPass').focus(), 120);
        }

        function verifyDownload() {
            if (document.getElementById('downloadPass').value === DOWNLOAD_PASS) {
                closeModal('downloadModal');
                cortanaSpeak("Download started!");
                if (currentDownload && currentDownload.blobUrl) {
                    const a = document.createElement('a');
                    a.href = currentDownload.blobUrl;
                    a.download = currentDownload.mainFile;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
                currentDownload = null;
            } else {
                const c = document.querySelector('#downloadModal .modal-content');
                c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
                document.getElementById('downloadError').classList.add('show');
                cortanaSpeak("Wrong password!");
            }
        }

        document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') verifyAdmin(); });
        document.getElementById('downloadPass').addEventListener('keydown', e => { if (e.key === 'Enter') verifyDownload(); });
        window.addEventListener('click', e => { if (e.target.classList.contains('modal') && e.target.classList.contains('active')) closeModal(e.target.id); });

        renderFiles();
    </script>
</body>
</html>
